<p>Heroes list</p>

<ul>
  @for (hero of heroes; track hero; let i = $index) {
    <li>{{ i+1 }} - {{ hero }}</li>
  }
</ul>

@if (deletedHero) {
  <div>
    <h3>Deleted Hero: <small>{{ deletedHero }}</small> </h3>
  </div>
} @else {
  <h3>Not deleted</h3>
}



<button (click)="deleteHero()">
  Delete
</button>
